name: WatchtowerWidget
options:
  bundleIdPrefix: com.keshavk3.watchtower
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  SWIFT_VERSION: "5.0"
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  SWIFT_EMIT_LOC_STRINGS: NO
targets:
  WatchtowerWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    resources:
      - path: Assets.xcassets
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.keshavk3.watchtower.widget
      PRODUCT_NAME: WatchtowerWidget
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_ENTITLEMENTS: WatchtowerWidget.entitlements
      SKIP_INSTALL: NO
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
    entitlements:
      path: WatchtowerWidget.entitlements
  WatchtowerWidgetBridge:
    type: library.dynamic
    platform: macOS
    sources:
      - path: Sources/Bridge
      - path: Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.keshavk3.watchtower.widget-bridge
      PRODUCT_NAME: WatchtowerWidgetBridge
      GENERATE_INFOPLIST_FILE: YES
      DEFINES_MODULE: YES
      SKIP_INSTALL: YES
      DYLIB_INSTALL_NAME_BASE: "@rpath"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      OTHER_LDFLAGS: "$(inherited) -framework WidgetKit"
schemes:
  WatchtowerWidget:
    build:
      targets:
        WatchtowerWidget: all
        WatchtowerWidgetBridge: all
# App Group shared with the host app: group.com.keshavk3.watchtower
